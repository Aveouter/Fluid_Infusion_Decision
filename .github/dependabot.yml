version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    ignore:
      # torch 的本地版本标签必须与 CUDA/CPU 索引一起升级，交由人工处理。
      - dependency-name: "torch"
    groups:
      python-dependencies:
        patterns: ["*"]
