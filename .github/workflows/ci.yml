name: CI

# 四道门禁在 PR 上并行运行；main 上同样运行。
# 全部测试只用合成 fixture；gpu / realdata 用例由 tests/conftest.py 自动跳过。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: "1"
  MPLBACKEND: "Agg"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install -r requirements-lint.txt
      - name: Lint
        run: python -m ruff check .

  protocol-freeze:
    name: protocol-freeze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify frozen evaluation protocol
        run: python freeze_eval_protocol.py

  repo-hygiene:
    name: repo-hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Check tracked tree hygiene
        run: python tools/check_repo_hygiene.py

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-base.txt
            requirements-ci.txt
      - name: Install CPU test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Record environment
        run: |
          python -c "import sys, torch, numpy, pandas, sklearn; print('python', sys.version.split()[0], 'torch', torch.__version__, 'numpy', numpy.__version__, 'pandas', pandas.__version__, 'sklearn', sklearn.__version__)"
          python -m pip freeze
      - name: Run tests
        run: |
          mkdir -p artifacts
          python -m pytest --color=no --junitxml=artifacts/junit.xml
      - name: Upload JUnit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: junit
          path: artifacts/junit.xml
          if-no-files-found: warn
          retention-days: 14
